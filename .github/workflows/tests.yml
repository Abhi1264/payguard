name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"
          cache: maven
      - name: Unit tests
        run: mvn -B -pl services/order-service,services/payment-service test
      - name: Package
        run: mvn -B -DskipTests package
      - name: Smoke and contract
        if: github.event_name == 'pull_request'
        run: mvn -B -pl automation test -Dsurefire.groups='smoke | contract'
      - name: Regression
        if: github.event_name == 'push'
        run: mvn -B -pl automation test
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: automation/target/allure-results
          if-no-files-found: ignore
